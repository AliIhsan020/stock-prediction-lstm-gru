[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bist100-forecasting"
version = "0.1.0"
description = "LSTM and GRU forecasting experiments for the BIST 100 index."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "torch>=2.6",
    "yfinance>=0.2.54",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.3",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bist100_forecasting"]
