[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bist100-forecasting"
version = "0.1.0"
description = "LSTM and GRU forecasting experiments for the BIST 100 index."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "matplotlib>=3.10",
    "numpy>=2.2",
    "pandas>=2.2",
    "scikit-learn>=1.6",
    "streamlit>=1.60.0",
    "torch>=2.6",
    "yfinance>=0.2.54",
]

[project.scripts]
bist100-download = "bist100_forecasting.cli:main"
bist100-eda = "bist100_forecasting.eda_cli:main"
bist100-prepare = "bist100_forecasting.preprocessing_cli:main"
bist100-train = "bist100_forecasting.train_cli:main"

[dependency-groups]
dev = [
    "jupyterlab>=4.3",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bist100_forecasting"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
